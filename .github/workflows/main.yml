name: Build Get Ready for BEM APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "docs/**"
      - ".github/workflows/main.yml"
      - "build.gradle"
      - "settings.gradle"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ==========================================
      # COPY WEBSITE INTO ANDROID APPLICATION
      # ==========================================

      - name: Prepare offline website
        shell: bash
        run: |
          echo "Preparing Get Ready for BEM offline website..."

          mkdir -p app/src/main/assets

          if [ ! -f docs/index.html ]; then
            echo "ERROR: docs/index.html was not found."
            exit 1
          fi

          rsync -av \
            --exclude='*.zip' \
            --exclude='.codesandbox' \
            --exclude='node_modules' \
            docs/ app/src/main/assets/

          echo "Website files copied successfully."

          test -f app/src/main/assets/index.html

          echo "Offline website is ready."

      # ==========================================
      # BUILD ANDROID APK
      # ==========================================

      - name: Build Android APK
        run: gradle :app:assembleDebug --stacktrace

      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Get-Ready-for-BEM-Offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
